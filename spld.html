<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpLD 讀寫障礙視覺模擬器 - 體驗孩子眼中的文字</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tesseract.js (用於實時文字識別) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        washi: '#FBF9F5',
                        washidark: '#F4EFE6',
                        wood: {
                            100: '#EFEAE4',
                            500: '#A38F7D',
                            700: '#8C7462',
                            800: '#6E5A4B',
                        },
                        matcha: {
                            100: '#EAF0EB',
                            500: '#7A8B7B',
                            700: '#5A6B5B',
                        },
                        stoneborder: '#E6E1DA'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Zen Maru Gothic"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            background-color: #FBF9F5;
            color: #4A4036;
        }

        .muji-card {
            background: rgba(251, 249, 245, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid #E6E1DA;
            box-shadow: 0 4px 20px -2px rgba(140, 116, 98, 0.08);
        }

        input[type=range] {
            accent-color: #8C7462;
            touch-action: manipulation;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-washi text-wood-800 overflow-x-hidden">

    <!-- 頂部導覽列 -->
    <header class="w-full muji-card shrink-0 px-3 sm:px-5 py-2.5 border-b border-stoneborder flex justify-between items-center z-30 sticky top-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-wood-700 text-washi flex items-center justify-center shadow-sm shrink-0">
                <i class="fa-solid fa-eye text-xs sm:text-base"></i>
            </div>
            <div>
                <h1 class="text-xs sm:text-base md:text-lg font-bold text-wood-800 flex items-center gap-1.5 sm:gap-2">
                    SpLD 視覺模擬器
                    <span class="text-[10px] sm:text-xs bg-matcha-100 text-matcha-700 font-medium px-2 py-0.5 rounded-full border border-matcha-500/20 hidden min-[380px]:inline-block">親師體驗</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-wood-500 hidden md:block">體驗學習困難孩子眼中的文字世界</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <button id="toggle-info-btn" class="bg-washi hover:bg-washidark text-wood-700 text-xs px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl border border-stoneborder transition flex items-center gap-1.5 shadow-sm active:scale-95">
                <i class="fa-solid fa-book-open text-matcha-700"></i>
                <span class="hidden sm:inline">SpLD 解說</span>
            </button>
            <button id="stop-cam-btn" class="bg-washi hover:bg-washidark text-rose-700 text-xs px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl border border-stoneborder transition flex items-center gap-1.5 shadow-sm active:scale-95 hidden">
                <i class="fa-solid fa-camera-retro"></i>
                <span class="hidden sm:inline">關閉相機</span>
            </button>
            <button id="switch-cam-btn" class="bg-washi hover:bg-washidark text-wood-700 text-xs px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl border border-stoneborder transition flex items-center gap-1.5 shadow-sm active:scale-95 hidden">
                <i class="fa-solid fa-camera-rotate"></i>
                <span class="hidden sm:inline">切換鏡頭</span>
            </button>
        </div>
    </header>

    <!-- 主展示畫面區 -->
    <main class="flex-1 relative flex flex-col items-center justify-start bg-washidark p-2 sm:p-4 md:p-6 w-full max-w-6xl mx-auto space-y-4">
        
        <div id="canvas-container" class="w-full min-h-[380px] sm:min-h-[480px] rounded-2xl sm:rounded-3xl overflow-hidden border border-stoneborder shadow-sm relative bg-washi flex items-center justify-center transition-all duration-300 cursor-crosshair">
            <video id="webcam" autoplay playsinline muted class="hidden"></video>
            <canvas id="spld-canvas" class="w-full h-full block"></canvas>

            <div id="focus-ring" class="absolute w-12 h-12 border-2 border-matcha-500 rounded-full pointer-events-none transition-all duration-300 opacity-0 transform -translate-x-1/2 -translate-y-1/2 scale-150 z-20"></div>

            <div id="cam-controls-bar" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 muji-card px-3.5 py-2 rounded-2xl border border-stoneborder flex items-center gap-3 hidden shadow-md">
                <div class="flex items-center gap-2 text-xs font-medium text-wood-700">
                    <i class="fa-solid fa-magnifying-glass-plus text-wood-500"></i>
                    <span class="hidden min-[400px]:inline">變焦</span>
                    <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1" class="w-24 sm:w-36 h-1.5 bg-wood-100 rounded-lg appearance-none cursor-pointer">
                    <span id="zoom-val" class="font-mono text-[11px] w-6">1.0x</span>
                </div>
            </div>

            <div id="start-overlay" class="absolute inset-0 bg-washi/95 z-20 flex flex-col items-center justify-center p-4 sm:p-6 text-center">
                <div class="w-14 h-14 sm:w-20 sm:h-20 rounded-2xl sm:rounded-3xl bg-wood-100 border border-stoneborder flex items-center justify-center text-wood-700 text-xl sm:text-3xl mb-3 sm:mb-4 shadow-sm">
                    <i class="fa-solid fa-camera text-wood-700"></i>
                </div>
                <h2 class="text-base sm:text-xl md:text-2xl font-bold text-wood-800 mb-1.5 sm:mb-2">開啟實時相機體驗</h2>
                <p class="text-wood-500 text-xs sm:text-sm max-w-md mb-4 sm:mb-6 leading-relaxed">
                    將相機對準課本或字卡。網頁將實時模擬特定學習困難學童看到的<span class="text-wood-700 font-bold">缺筆劃</span>、<span class="text-matcha-700 font-bold">字體浮動跳動</span>與<span class="text-wood-800 font-bold">偏旁錯位</span>視覺體驗。
                </p>
                <button id="start-cam-btn" class="bg-wood-700 hover:bg-wood-800 text-washi font-medium py-2.5 sm:py-3 px-6 sm:px-8 rounded-2xl shadow-sm transition transform hover:scale-105 active:scale-95 flex items-center gap-2 text-xs sm:text-sm">
                    <i class="fa-solid fa-circle-play"></i> 啟動相機模擬
                </button>
            </div>

            <div id="status-badge" class="absolute top-2.5 left-2.5 sm:top-4 sm:left-4 z-10 muji-card px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full border border-stoneborder flex items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs hidden shadow-sm">
                <span id="status-dot" class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-matcha-500 animate-pulse"></span>
                <span id="status-text" class="text-wood-700 font-medium">相機運行中</span>
            </div>
        </div>

        <div class="w-full z-20">
            <div id="controls-panel" class="muji-card rounded-2xl sm:rounded-3xl p-3 sm:p-5 border border-stoneborder transition-all duration-300">
                
                <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-stoneborder">
                    <div class="flex gap-1.5 sm:gap-2 text-xs font-bold overflow-x-auto pb-1 sm:pb-0 no-scrollbar">
                        <button id="tab-mode-ocr" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-wood-700 text-washi transition shadow-sm text-[11px] sm:text-xs shrink-0">
                            <i class="fa-solid fa-camera mr-1"></i>相機實時體驗
                        </button>
                        <button id="tab-mode-preset" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0">
                            <i class="fa-solid fa-book-bookmark mr-1 text-matcha-700"></i>經典範文體驗
                        </button>
                        <button id="tab-mode-text" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0">
                            <i class="fa-solid fa-pen-nib mr-1"></i>自訂文字體驗
                        </button>
                    </div>
                </div>

                <div id="preset-article-container" class="hidden mb-3">
                    <label class="block text-[11px] sm:text-xs font-medium text-wood-700 mb-1">選擇經典古詩文 / 英文小故事：</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <select id="preset-article-select" class="flex-1 bg-washi border border-stoneborder rounded-xl px-3 py-2 text-xs text-wood-800 focus:outline-none focus:border-wood-500 font-serif">
                            <option value="【高拆解率古詩】唐·李白《靜夜思》：床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。">唐·李白《靜夜思》</option>
                            <option value="【高拆解率古詩】唐·孟浩然《春曉》：春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。">唐·孟浩然《春曉》</option>
                            <option value="【高拆解率古詩】唐·王之渙《登鸛雀樓》：白日依山盡，黃河入海流。欲窮千里目，更上一層樓。">唐·王之渙《登鸛雀樓》</option>
                            <option value="【高拆解率古詩】唐·王維《相思》：紅豆生南國，春來發幾枝。願君多採擷，此物最相思。">唐·王維《相思》</option>
                            <option value="【高拆解率古詩】唐·孟郊《遊子吟》：慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。">唐·孟郊《遊子吟》</option>
                            <option value="【高拆解率古文】唐·劉禹錫《陋室銘》：山不在高，有仙則名。水不在深，有龍則靈。斯是陋室，惟吾德馨。苔痕上階綠，草色入簾青。">唐·劉禹錫《陋室銘》</option>
                            <option value="English Story: The Little Blue Dog: Once upon a time, a playful little blue dog named Toby loved to run in the green park with his friends. Reading can feel confusing when letters like b, d, p, and q swirl around on the page.">【English】The Little Blue Dog</option>
                            <option value="English Story: A Rainy Day Adventure: Raindrops started falling gently on the window screen. Emma put on her yellow raincoat and red boots to jump in the big water puddles outside.">【English】A Rainy Day Adventure</option>
                        </select>
                        <button id="preview-preset-btn" class="bg-wood-700 hover:bg-wood-800 text-washi font-medium px-4 py-2 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1.5 shrink-0 active:scale-95">
                            <i class="fa-solid fa-play"></i> 立即體驗
                        </button>
                    </div>
                </div>

                <div id="custom-text-input-container" class="hidden mb-3">
                    <label class="block text-[11px] sm:text-xs font-medium text-wood-700 mb-1">自訂任何文字體驗：</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="custom-text-input" value="國文預習第一課：床前明月光，疑是地上霜。" 
                            class="flex-1 bg-washi border border-stoneborder rounded-xl px-3 py-1.5 sm:py-2 text-xs text-wood-800 focus:outline-none focus:border-wood-500">
                        <div class="flex gap-2">
                            <button id="preset-btn-1" class="flex-1 sm:flex-none bg-washidark hover:bg-wood-100 text-wood-700 text-xs px-3 py-1.5 rounded-xl border border-stoneborder">國文範例</button>
                            <button id="preset-btn-2" class="flex-1 sm:flex-none bg-washidark hover:bg-wood-100 text-wood-700 text-xs px-3 py-1.5 rounded-xl border border-stoneborder">English</button>
                            <button id="preview-custom-btn" class="flex-1 sm:flex-none bg-wood-700 hover:bg-wood-800 text-washi font-medium px-4 py-1.5 sm:py-2 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1.5 shrink-0 active:scale-95">
                                <i class="fa-solid fa-play"></i> 立即體驗
                            </button>
                        </div>
                    </div>
                </div>

                <!-- SpLD 視覺強度控制滑桿 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 text-xs">
                    <div class="bg-washi p-2.5 sm:p-3 rounded-xl sm:rounded-2xl border border-stoneborder">
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-bold text-wood-800 flex items-center gap-1 text-[11px] sm:text-xs">
                                <i class="fa-solid fa-eraser text-wood-500"></i> 筆劃缺失
                            </label>
                            <span id="val-missing" class="text-wood-500 font-mono text-[10px] sm:text-xs">50%</span>
                        </div>
                        <input type="range" id="param-missing" min="0" max="100" value="50" class="w-full h-1.5 bg-wood-100 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="bg-washi p-2.5 sm:p-3 rounded-xl sm:rounded-2xl border border-stoneborder">
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-bold text-wood-800 flex items-center gap-1 text-[11px] sm:text-xs">
                                <i class="fa-solid fa-water text-matcha-500"></i> 字體漂浮
                            </label>
                            <span id="val-jitter" class="text-wood-500 font-mono text-[10px] sm:text-xs">0%</span>
                        </div>
                        <input type="range" id="param-jitter" min="0" max="100" value="0" class="w-full h-1.5 bg-wood-100 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="bg-washi p-2.5 sm:p-3 rounded-xl sm:rounded-2xl border border-stoneborder">
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-bold text-wood-800 flex items-center gap-1 text-[11px] sm:text-xs">
                                <i class="fa-solid fa-arrows-rotate text-wood-500"></i> 部首錯位
                            </label>
                            <span id="val-swap" class="text-wood-500 font-mono text-[10px] sm:text-xs">50%</span>
                        </div>
                        <input type="range" id="param-swap" min="0" max="100" value="50" class="w-full h-1.5 bg-wood-100 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="bg-washi p-2.5 sm:p-3 rounded-xl sm:rounded-2xl border border-stoneborder">
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-bold text-wood-800 flex items-center gap-1 text-[11px] sm:text-xs">
                                <i class="fa-solid fa-compress text-matcha-500"></i> 視覺擁擠
                            </label>
                            <span id="val-crowding" class="text-wood-500 font-mono text-[10px] sm:text-xs">0%</span>
                        </div>
                        <input type="range" id="param-crowding" min="0" max="100" value="0" class="w-full h-1.5 bg-wood-100 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="w-full text-center py-2 px-3 bg-washi border-t border-stoneborder shrink-0 z-30">
        <p class="text-[10px] sm:text-xs text-wood-500 tracking-wide font-medium">
            — M. Hea Limited ｜讀寫孩子眼中的世界｜網頁由 Google Gemini 製作 —
        </p>
    </footer>

    <!-- SpLD 說明 Modal -->
    <div id="info-modal" class="fixed inset-0 bg-wood-800/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="muji-card max-w-xl w-full rounded-3xl p-6 md:p-8 border border-stoneborder shadow-xl relative max-h-[85vh] overflow-y-auto no-scrollbar">
            <button id="close-modal-btn" class="absolute top-5 right-5 text-wood-500 hover:text-wood-800 text-lg w-8 h-8 rounded-full bg-washidark flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex items-center gap-2.5 mb-4">
                <div class="w-8 h-8 rounded-xl bg-matcha-100 text-matcha-700 flex items-center justify-center">
                    <i class="fa-solid fa-heart text-sm"></i>
                </div>
                <h3 class="text-lg font-bold text-wood-800">SpLD 讀寫障礙陪伴解說</h3>
            </div>
            <div class="space-y-3.5 text-xs md:text-sm text-wood-700 leading-relaxed">
                <div class="bg-washi p-4 rounded-2xl border border-stoneborder">
                    <h4 class="font-bold text-wood-800 mb-1 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-wood-500"></span> 1. 筆劃缺失
                    </h4>
                    <p class="text-wood-500 text-xs">大腦解析漢字時容易隨機遺漏左右或上下偏旁筆劃，導致閱讀困難。</p>
                </div>
                <div class="bg-washi p-4 rounded-2xl border border-stoneborder">
                    <h4 class="font-bold text-wood-800 mb-1 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-matcha-500"></span> 2. 字體漂浮跳動
                    </h4>
                    <p class="text-wood-500 text-xs">印刷黑字容易出現扭曲、旋轉或浮動感。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM 引用
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('spld-canvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');
        const focusRing = document.getElementById('focus-ring');
        
        const startOverlay = document.getElementById('start-overlay');
        const startCamBtn = document.getElementById('start-cam-btn');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        
        const camControlsBar = document.getElementById('cam-controls-bar');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');

        const tabModeOcr = document.getElementById('tab-mode-ocr');
        const tabModePreset = document.getElementById('tab-mode-preset');
        const tabModeText = document.getElementById('tab-mode-text');
        
        const presetArticleContainer = document.getElementById('preset-article-container');
        const presetArticleSelect = document.getElementById('preset-article-select');
        const previewPresetBtn = document.getElementById('preview-preset-btn');
        const customTextInputContainer = document.getElementById('custom-text-input-container');
        const customTextInput = document.getElementById('custom-text-input');
        const presetBtn1 = document.getElementById('preset-btn-1');
        const presetBtn2 = document.getElementById('preset-btn-2');
        const previewCustomBtn = document.getElementById('preview-custom-btn');
        
        const paramMissing = document.getElementById('param-missing');
        const paramJitter = document.getElementById('param-jitter');
        const paramSwap = document.getElementById('param-swap');
        const paramCrowding = document.getElementById('param-crowding');
        
        const valMissing = document.getElementById('val-missing');
        const valJitter = document.getElementById('val-jitter');
        const valSwap = document.getElementById('val-swap');
        const valCrowding = document.getElementById('val-crowding');
        
        const stopCamBtn = document.getElementById('stop-cam-btn');
        const switchCamBtn = document.getElementById('switch-cam-btn');
        const toggleInfoBtn = document.getElementById('toggle-info-btn');
        const infoModal = document.getElementById('info-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // 狀態變數
        let currentStream = null;
        let videoTrack = null;
        let currentMode = 'ocr';
        let facingMode = 'environment';
        let worker = null;
        let ocrResults = [];
        let isOcrProcessing = false;
        let animationFrameId = null;
        let lastFocusPoint = null;

        // 常見拆解字字典 (左右結構 / 上下結構)
        const decomposableChars = {
            '明': { type: 'lr', p1: '日', p2: '月' },
            '休': { type: 'lr', p1: '亻', p2: '木' },
            '林': { type: 'lr', p1: '木', p2: '木' },
            '相': { type: 'lr', p1: '木', p2: '目' },
            '靜': { type: 'lr', p1: '青', p2: '爭' },
            '頭': { type: 'lr', p1: '豆', p2: '頁' },
            '故': { type: 'lr', p1: '古', p2: '攵' },
            '聽': { type: 'lr', p1: '耳', p2: '德' },
            '曉': { type: 'lr', p1: '日', p2: '堯' },
            '處': { type: 'lr', p1: '虍', p2: '夂' },
            '流': { type: 'lr', p1: '氵', p2: '㐬' },
            '樓': { type: 'lr', p1: '木', p2: '婁' },
            '枝': { type: 'lr', p1: '木', p2: '支' },
            '採': { type: 'lr', p1: '扌', p2: '采' },
            '縫': { type: 'lr', p1: '纟', p2: '逢' },
            '李': { type: 'tb', p1: '木', p2: '子' },
            '思': { type: 'tb', p1: '田', p2: '心' },
            '舉': { type: 'tb', p1: '興', p2: '手' },
            '春': { type: 'tb', p1: '𡗗', p2: '日' },
            '落': { type: 'tb', p1: '艹', p2: '洛' },

        // 初始化相機控制 capabilities
        async function initCameraCapabilities() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (capabilities.zoom) {
                    zoomSlider.min = capabilities.zoom.min || 1;
                    zoomSlider.max = capabilities.zoom.max || 3;
                    zoomSlider.step = capabilities.zoom.step || 0.1;
                    zoomSlider.value = videoTrack.getSettings().zoom || 1;
                    zoomVal.innerText = `${parseFloat(zoomSlider.value).toFixed(1)}x`;
                }
            } catch (err) {
                console.log("硬體變焦不支援", err);
            }
        }

        zoomSlider.oninput = async () => {
            const zoomLevel = parseFloat(zoomSlider.value);
            zoomVal.innerText = `${zoomLevel.toFixed(1)}x`;
            if (videoTrack && videoTrack.applyConstraints) {
                try {
                    await videoTrack.applyConstraints({ advanced: [{ zoom: zoomLevel }] });
                } catch (e) {}
            }
        };

        // Canvas 點擊觸發對焦
        canvas.onclick = async (e) => {
            if (currentMode !== 'ocr') return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            lastFocusPoint = { x: clickX, y: clickY, time: Date.now() };

            focusRing.style.left = `${clickX}px`;
            focusRing.style.top = `${clickY}px`;
            focusRing.classList.remove('opacity-0', 'scale-150');
            focusRing.classList.add('opacity-100', 'scale-100');

            setTimeout(() => {
                focusRing.classList.remove('opacity-100', 'scale-100');
                focusRing.classList.add('opacity-0', 'scale-150');
            }, 600);

            if (videoTrack && videoTrack.applyConstraints) {
                try {
                    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                    if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    }
                } catch (err) {}
            }
            processOCR(true);
        };

        // 相機啟動
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                videoTrack = currentStream.getVideoTracks()[0];
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                startOverlay.classList.add('hidden');
                statusBadge.classList.remove('hidden');
                camControlsBar.classList.remove('hidden');
                stopCamBtn.classList.remove('hidden');
                switchCamBtn.classList.remove('hidden');

                initCameraCapabilities();
                resizeCanvas();
                initTesseract();
                requestAnimationFrame(renderLoop);

            } catch (err) {
                alert('無法存取相機，請確認您已授予瀏覽器相機使用權限。');
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                videoTrack = null;
            }
            startOverlay.classList.remove('hidden');
            statusBadge.classList.add('hidden');
            camControlsBar.classList.add('hidden');
            stopCamBtn.classList.add('hidden');
            switchCamBtn.classList.add('hidden');
        }

        // Tesseract 初始化與前處理
        async function initTesseract() {
            if (!worker) {
                statusText.innerText = "正在載入 OCR 引擎...";
                worker = await Tesseract.createWorker('chi_tra+eng');
                await worker.setParameters({
                    tessedit_pageseg_mode: Tesseract.PSM.AUTO,
                });
                statusText.innerText = "相機辨識中";
            }
        }

        async function processOCR(forceRegion = false) {
            if (!worker || isOcrProcessing || currentMode !== 'ocr' || !video.videoWidth) return;
            isOcrProcessing = true;

            try {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                tempCtx.drawImage(video, 0, 0);

                // 自適應二值化強化前處理
                const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    const v = avg < 110 ? 0 : 255;
                    data[i] = v; data[i + 1] = v; data[i + 2] = v;
                }
                tempCtx.putImageData(imgData, 0, 0);

                const ret = await worker.recognize(tempCanvas);
                if (ret && ret.data && ret.data.words) {
                    ocrResults = ret.data.words.filter(w => w.confidence > 40);
                }
            } catch (err) {
                console.log("OCR Error:", err);
            } finally {
                isOcrProcessing = false;
            }
        }

        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);

        // 主渲染循環
        function renderLoop() {
            if (currentMode === 'ocr') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    renderSpLDOverlayOnCamera();
                }
                if (!isOcrProcessing && Math.random() < 0.1) {
                    processOCR();
                }
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        }

        // 相機模式下 SpLD 視覺效果套用
        function renderSpLDOverlayOnCamera() {
            const missing = parseInt(paramMissing.value) / 100;
            const jitter = parseInt(paramJitter.value) / 100;
            const swap = parseInt(paramSwap.value) / 100;

            const scaleX = canvas.width / (video.videoWidth || 1);
            const scaleY = canvas.height / (video.videoHeight || 1);

            const nowSec = Math.floor(Date.now() / 1000);

            ocrResults.forEach((word) => {
                const bbox = word.bbox;
                const x = bbox.x0 * scaleX;
                const y = bbox.y0 * scaleY;
                const w = (bbox.x1 - bbox.x0) * scaleX;
                const h = (bbox.y1 - bbox.y0) * scaleY;

                const text = word.text.trim();
                if (!text) return;

                ctx.save();

                // 飄浮 Jitter
                let offsetX = 0, offsetY = 0;
                if (jitter > 0) {
                    offsetX = Math.sin(Date.now() / 200 + x) * (jitter * 12);
                    offsetY = Math.cos(Date.now() / 200 + y) * (jitter * 12);
                }

                ctx.translate(x + w / 2 + offsetX, y + h / 2 + offsetY);

                const fontSize = Math.max(16, h * 0.8);
                ctx.font = `${fontSize}px "Noto Serif TC", serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#1A1A1A';

                // 針對文字逐字繪製並解析偏旁結構
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const decomp = decomposableChars[char];

                    // 筆劃缺失獨立隨機判斷 (不與錯位綁定)
                    const isMissingHide = Math.random() < missing;
                    const hideSide = (nowSec + char.charCodeAt(0)) % 2 === 0 ? 'p1' : 'p2';

                    if (decomp) {
                        const isSwapped = Math.random() < swap;
                        const first = isSwapped ? decomp.p2 : decomp.p1;
                        const second = isSwapped ? decomp.p1 : decomp.p2;

                        if (decomp.type === 'lr') {
                            ctx.save();
                            // 第一部首
                            if (!(isMissingHide && hideSide === 'p1')) {
                                ctx.fillText(first, -fontSize * 0.25, 0);
                            }
                            // 第二部首
                            if (!(isMissingHide && hideSide === 'p2')) {
                                ctx.fillText(second, fontSize * 0.25, 0);
                            }
                            ctx.restore();
                        } else {
                            ctx.save();
                            if (!(isMissingHide && hideSide === 'p1')) {
                                ctx.fillText(first, 0, -fontSize * 0.25);
                            }
                            if (!(isMissingHide && hideSide === 'p2')) {
                                ctx.fillText(second, 0, fontSize * 0.25);
                            }
                            ctx.restore();
                        }
                    } else {
                        // 一般字元處理：若缺筆劃命中則徹底不渲染 (完全擦除)
                        if (!isMissingHide) {
                            ctx.fillText(char, (i - text.length / 2) * (fontSize * 0.6), 0);
                        }
                    }
                }
                ctx.restore();
            });
        }

        // 範文與自訂文字通用 Overlay 渲染
        function renderArticleOverlay(title, textContent) {
            cancelAnimationFrame(animationFrameId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 卡片背景
            ctx.fillStyle = '#FBF9F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const missing = parseInt(paramMissing.value) / 100;
            const jitter = parseInt(paramJitter.value) / 100;
            const swap = parseInt(paramSwap.value) / 100;
            const crowding = parseInt(paramCrowding.value) / 100;

            const isEnglish = textContent.startsWith('English Story:');

            ctx.save();

            // 標題繪製
            ctx.fillStyle = '#4A4036';
            ctx.font = 'bold 22px "Zen Maru Gothic", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, 50);

            // 內文排版與行距調整
            const baseLineHeight = isEnglish ? 36 : 48;
            const lineHeight = baseLineHeight * (1 - crowding * 0.4);
            const startY = 110;
            const fontSize = isEnglish ? 18 : 24;

            const nowSec = Math.floor(Date.now() / 1000);

            if (isEnglish) {
                // 英文模式：按單字進行 Letter-Spacing / Word-Spacing 清晰對齊
                const words = textContent.replace('English Story: ', '').split(' ');
                let curX = 40;
                let curY = startY;
                const maxX = canvas.width - 40;

                words.forEach((word) => {
                    const wordWidth = word.length * (fontSize * 0.55);
                    if (curX + wordWidth > maxX) {
                        curX = 40;
                        curY += lineHeight;
                    }

                    for (let i = 0; i < word.length; i++) {
                        let ch = word[i];
                        // 字母鏡像 (b/d, p/q)
                        if (Math.random() < swap) {
                            if (ch === 'b') ch = 'd';
                            else if (ch === 'd') ch = 'b';
                            else if (ch === 'p') ch = 'q';
                            else if (ch === 'q') ch = 'p';
                        }

                        const isMissing = Math.random() < missing;

                        if (!isMissing) {
                            ctx.save();
                            let jx = 0, jy = 0;
                            if (jitter > 0) {
                                jx = Math.sin(Date.now() / 200 + curX) * (jitter * 8);
                                jy = Math.cos(Date.now() / 200 + curY) * (jitter * 8);
                            }
                            ctx.font = `${fontSize}px sans-serif`;
                            ctx.fillStyle = '#2C2523';
                            ctx.fillText(ch, curX + jx, curY + jy);
                            ctx.restore();
                        }
                        curX += fontSize * 0.55;
                    }
                    // 單字間距
                    curX += fontSize * 0.45;
                });

            } else {
                // 中文模式：置中與結構拆拆處理
                const lines = textContent.split('：');
                const contentText = lines[1] || textContent;
                const charArray = Array.from(contentText);

                let curX = 60;
                let curY = startY;
                const maxX = canvas.width - 60;

                charArray.forEach((char) => {
                    if (curX > maxX || char === '。' || char === '，') {
                        if (curX > maxX) {
                            curX = 60;
                            curY += lineHeight;
                        }
                    }

                    const decomp = decomposableChars[char];
                    const isMissingHide = Math.random() < missing;
                    const hideSide = (nowSec + char.charCodeAt(0)) % 2 === 0 ? 'p1' : 'p2';

                    let jx = 0, jy = 0;
                    if (jitter > 0) {
                        jx = Math.sin(Date.now() / 200 + curX) * (jitter * 10);
                        jy = Math.cos(Date.now() / 200 + curY) * (jitter * 10);
                    }

                    ctx.save();
                    ctx.translate(curX + jx, curY + jy);
                    ctx.font = `${fontSize}px "Noto Serif TC", serif`;
                    ctx.fillStyle = '#2C2523';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    if (decomp) {
                        const isSwapped = Math.random() < swap;
                        const first = isSwapped ? decomp.p2 : decomp.p1;
                        const second = isSwapped ? decomp.p1 : decomp.p2;

                        if (decomp.type === 'lr') {
                            if (!(isMissingHide && hideSide === 'p1')) ctx.fillText(first, -fontSize * 0.25, 0);
                            if (!(isMissingHide && hideSide === 'p2')) ctx.fillText(second, fontSize * 0.25, 0);
                        } else {
                            if (!(isMissingHide && hideSide === 'p1')) ctx.fillText(first, 0, -fontSize * 0.25);
                            if (!(isMissingHide && hideSide === 'p2')) ctx.fillText(second, 0, fontSize * 0.25);
                        }
                    } else {
                        if (!isMissingHide) {
                            ctx.fillText(char, 0, 0);
                        }
                    }
                    ctx.restore();

                    curX += fontSize * 1.4;
                });
            }

            ctx.restore();
        }

        // 滑桿事件重繪
        [paramMissing, paramJitter, paramSwap, paramCrowding].forEach(input => {
            input.oninput = () => {
                valMissing.innerText = `${paramMissing.value}%`;
                valJitter.innerText = `${paramJitter.value}%`;
                valSwap.innerText = `${paramSwap.value}%`;
                valCrowding.innerText = `${paramCrowding.value}%`;

                if (currentMode === 'preset') {
                    const sel = presetArticleSelect.value;
                    const parts = sel.split('：');
                    renderArticleOverlay(parts[0], parts[1] || sel);
                } else if (currentMode === 'sandbox') {
                    renderArticleOverlay("自訂文字體驗", customTextInput.value);
                }
            };
        });

            tabModeText.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0';

            paramMissing.value = 50; valMissing.innerText = '50%';
            paramJitter.value = 0; valJitter.innerText = '0%';
            paramSwap.value = 50; valSwap.innerText = '50%';
            paramCrowding.value = 0; valCrowding.innerText = '0%';

            currentMode = 'preset';
            tabModePreset.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-wood-700 text-washi transition shadow-sm text-[11px] sm:text-xs shrink-0';
            tabModeOcr.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0';
            tabModeText.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0';

            presetArticleContainer.classList.remove('hidden');
            customTextInputContainer.classList.add('hidden');

            paramMissing.value = 0; valMissing.innerText = '0%';
            paramJitter.value = 0; valJitter.innerText = '0%';
            paramSwap.value = 0; valSwap.innerText = '0%';
            paramCrowding.value = 0; valCrowding.innerText = '0%';

            stopCamera();
            const sel = presetArticleSelect.value;
            const parts = sel.split('：');
            renderArticleOverlay(parts[0], parts[1] || sel);
        };

        tabModeText.onclick = () => {
            currentMode = 'sandbox';
            tabModeText.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-wood-700 text-washi transition shadow-sm text-[11px] sm:text-xs shrink-0';
            tabModeOcr.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0';
            tabModePreset.className = 'px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-washi text-wood-700 border border-stoneborder transition hover:bg-washidark text-[11px] sm:text-xs shrink-0';

            presetArticleContainer.classList.add('hidden');
            customTextInputContainer.classList.remove('hidden');

            paramMissing.value = 0; valMissing.innerText = '0%';
            paramJitter.value = 0; valJitter.innerText = '0%';
            paramSwap.value = 0; valSwap.innerText = '0%';
            paramCrowding.value = 0; valCrowding.innerText = '0%';

            stopCamera();
            renderArticleOverlay("自訂文字體驗", customTextInput.value);
        };

        // 控制按鈕監聽
        startCamBtn.onclick = startCamera;
        stopCamBtn.onclick = stopCamera;

        switchCamBtn.onclick = () => {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        };

        previewPresetBtn.onclick = () => {
            const sel = presetArticleSelect.value;
            const parts = sel.split('：');
            renderArticleOverlay(parts[0], parts[1] || sel);
        };

        previewCustomBtn.onclick = () => {
            renderArticleOverlay("自訂文字體驗", customTextInput.value);
        };

        presetBtn1.onclick = () => {
            customTextInput.value = "國文預習第一課：床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。";
            renderArticleOverlay("自訂文字體驗", customTextInput.value);
        };

        presetBtn2.onclick = () => {
            customTextInput.value = "English Story: The Little Blue Dog: Once upon a time, a playful little blue dog named Toby loved to run in the park.";
            renderArticleOverlay("自訂文字體驗", customTextInput.value);
        };

        toggleInfoBtn.onclick = () => infoModal.classList.remove('hidden');
        closeModalBtn.onclick = () => infoModal.classList.add('hidden');

        // 初始化畫布
        window.onload = () => {
            resizeCanvas();
        };
    </script>
</body>
</html>
